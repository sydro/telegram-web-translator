<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telegram Translator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">A↔</span>
        <div>
          <h1>Telegram Translator</h1>
          <p>Traduzione locale in Chrome</p>
        </div>
      </header>

      <form id="settings-form" novalidate>
        <div class="toggle-row">
          <div>
            <label for="extension-enabled">Estensione attiva</label>
            <p>Mostra e prepara le traduzioni su Telegram Web</p>
          </div>
          <label class="switch" aria-label="Attiva o disattiva l’estensione">
            <input id="extension-enabled" name="enabled" type="checkbox">
            <span aria-hidden="true"></span>
          </label>
        </div>

        <label for="source-language">Lingua di origine</label>
        <select id="source-language" name="sourceLanguage"></select>

        <label for="target-language">Lingua di destinazione</label>
        <select id="target-language" name="targetLanguage"></select>

        <label for="delay-ms">Ritardo anteprima</label>
        <div class="delay-control">
          <input id="delay-ms" name="delayMs" type="number" min="300" max="3000" step="100" inputmode="numeric">
          <span>ms</span>
        </div>

        <button id="save-settings" type="submit">Salva impostazioni</button>
        <p id="settings-status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
